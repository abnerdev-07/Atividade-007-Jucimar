<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Equipe - Sistema Corporativo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/static.css') }}">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .navbar-custom {
            background-color: #337ab7;
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: #ffffff !important;
        }
        .navbar-custom .nav-link:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand navbar-custom mb-4 py-3">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand fw-semibold" href="#">Sistema Corporativo</a>
            <div class="navbar-nav">
                <a class="nav-link px-3" href="#">Home</a>
                <a class="nav-link px-3 fw-bold" href="{{ url_for('contatos.listar_contatos') }}">Contatos</a>
                <a class="nav-link px-3" href="#">Sair</a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Script necessário para componentes do Bootstrap se precisar -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
