<!-- templates/tarefas/adicionar_tarefa.html -->
{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center" style="display: flex; justify-content: center; margin-top: 3rem;">
    <div style="width: 100%; max-width: 650px;">
        
        <div class="card" style="background-color: #ffffff; border-radius: 4px; box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35); border: none; overflow: hidden;">
            
            <div style="background-color: #198754; color: #ffffff; text-align: center; padding: 1.5rem 1rem;">
                <h3 style="margin: 0; font-size: 1.45rem; font-weight: 400; letter-spacing: 0.5px;">Criar Nova Tarefa</h3>
            </div>
            
            <div style="padding: 2.5rem;">
                <form action="{{ url_for('tarefas.nova_tarefa') }}" method="POST">
                    
                    <div style="margin-bottom: 1.5rem;">
                        <label for="descricao" style="display: inline-block; margin-bottom: 0.6rem; color: #444444; font-size: 1.05rem; font-weight: 500;">Descrição da Demanda *</label>
                        <textarea id="descricao" name="descricao" required rows="3" placeholder="Descreva obrigatoriamente os detalhes da tarefa..." style="display: block; width: 100%; padding: 0.75rem 0.8rem; font-size: 1.05rem; color: #333333; background-color: #fff; border: 1px solid #cccccc; border-radius: 4px; box-sizing: border-box; resize: vertical;"></textarea>
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: inline-block; margin-bottom: 0.6rem; color: #444444; font-size: 1.05rem; font-weight: 500;">Atribuir Responsáveis (Time) *</label>
                        <div style="border: 1px solid #cccccc; border-radius: 4px; padding: 1rem; max-height: 150px; overflow-y: auto; background-color: #f9f9f9;">
                            {% for contato in contatos %}
                            <div style="display: flex; align-items: center; margin-bottom: 0.5rem; gap: 0.5rem;">
                                <input type="checkbox" id="contato_{{ contato[0] }}" name="contatos_ids" value="{{ contato[0] }}" style="width: 1.15rem; height: 1.15rem; cursor: pointer;">
                                <label for="contato_{{ contato[0] }}" style="font-size: 1rem; color: #333333; cursor: pointer;">{{ contato[1] }}</label>
                            </div>
                            {% else %}
                            <p style="margin: 0; color: #dc3545; font-size: 0.95rem;">Nenhum colaborador cadastrado no time ainda.</p>
                            {% endfor %}
                        </div>
                    </div>

                    <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                        <!-- Prazo -->
                        <div style="flex: 1;">
                            <label for="prazo" style="display: inline-block; margin-bottom: 0.6rem; color: #444444; font-size: 1.05rem; font-weight: 500;">Prazo</label>
                            <input type="date" id="prazo" name="prazo" style="display: block; width: 100%; padding: 0.75rem 0.8rem; font-size: 1.05rem; color: #333333; background-color: #fff; border: 1px solid #cccccc; border-radius: 4px; box-sizing: border-box;">
                        </div>

                        <div style="flex: 1;">
                            <label for="prioridade" style="display: inline-block; margin-bottom: 0.6rem; color: #444444; font-size: 1.05rem; font-weight: 500;">Prioridade</label>
                            <select id="prioridade" name="prioridade" style="display: block; width: 100%; padding: 0.75rem 0.8rem; font-size: 1.05rem; color: #333333; background-color: #fff; border: 1px solid #cccccc; border-radius: 4px; box-sizing: border-box; height: 47px;">
                                {% for p in prioridades %}
                                <option value="{{ p }}" {% if p == 'media' %}selected{% endif %}>{{ p | capitalize }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Status -->
                    <div style="margin-bottom: 2.2rem;">
                        <label for="status" style="display: inline-block; margin-bottom: 0.6rem; color: #444444; font-size: 1.05rem; font-weight: 500;">Status Inicial</label>
                        <select id="status" name="status" style="display: block; width: 100%; padding: 0.75rem 0.8rem; font-size: 1.05rem; color: #333333; background-color: #fff; border: 1px solid #cccccc; border-radius: 4px; box-sizing: border-box; height: 47px;">
                            {% for s in status_opcoes %}
                            <option value="{{ s }}" {% if s == 'fazer' %}selected{% endif %}>{{ s | capitalize }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                        <a href="{{ url_for('tarefas.listar') }}" style="display: inline-flex; align-items: center; justify-content: center; background-color: #6c757d; color: #ffffff; text-decoration: none; padding: 0.65rem 1.8rem; font-size: 1rem; font-weight: 500; border-radius: 4px;">
                            Voltar
                        </a>
                        <button type="submit" style="display: inline-flex; align-items: center; justify-content: center; background-color: #198754; color: #ffffff; padding: 0.65rem 1.8rem; font-size: 1rem; font-weight: 500; border-radius: 4px; border: none; cursor: pointer;">
                            Cadastrar Tarefa
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
    </div>
</div>
{% endblock %}
