{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div style="display: flex; justify-content: center; margin-top: 5rem;">
        <div style="width: 100%; max-width: 600px;">
            <div class="card" style="background-color: #fff; border-radius: 4px; box-shadow: 0 12px 28px rgba(0,0,0,.35); border: none; overflow: hidden;">

                <div style="background-color: #2e343a; color: #fff; text-align: center; padding: 1.5rem 1rem;">
                    <h3 style="margin: 0; font-size: 1.45rem; font-weight: 400;">{{ 'Editar Colaborador' if contato else 'Cadastrar Novo Colaborador' }}</h3>
                </div>

                <div style="padding: 2.5rem 2.5rem 2rem 2.5rem;">
                    <form action="" method="POST">

                        <div style="margin-bottom: 1.5rem;">
                            <label for="nome" style="display:inline-block; margin-bottom:.6rem; color:#444; font-weight:500;">Nome Completo *</label>
                            <input type="text" id="nome" name="nome" value="{{ contato.nome if contato else '' }}" required style="display:block; width:100%; padding:.75rem .8rem; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
                        </div>

                        <div style="margin-bottom: 1.5rem;">
                            <label for="email" style="display:inline-block; margin-bottom:.6rem; color:#444; font-weight:500;">E-mail Corporativo *</label>
                            <input type="email" id="email" name="email" value="{{ contato.email if contato and contato.email else '' }}" required style="display:block; width:100%; padding:.75rem .8rem; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
                        </div>

                        <div style="margin-bottom: 2.2rem;">
                            <label for="telefone" style="display:inline-block; margin-bottom:.6rem; color:#444; font-weight:500;">Telefone</label>
                            <input type="text" id="telefone" name="telefone" value="{{ contato.telefone if contato and contato.telefone else '' }}" style="display:block; width:100%; padding:.75rem .8rem; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <a href="{{ url_for('contatos.listar_contatos') }}" style="background:#6c757d; color:#fff; text-decoration:none; padding:.65rem 1.8rem; border-radius:4px;">Voltar</a>
                            <button type="submit" style="background:#007bff; color:#fff; padding:.65rem 1.8rem; border-radius:4px; border:none; cursor:pointer;">{{ 'Salvar Alterações' if contato else 'Salvar Registro' }}</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
