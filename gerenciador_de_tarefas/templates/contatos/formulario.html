{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center" style="display: flex; justify-content: center; margin-top: 5rem;">
        <div style="width: 100%; max-width: 600px;">
            
            <div class="card" style="background-color: #ffffff; border-radius: 4px; box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35); border: none; overflow: hidden;">
                
                <div style="background-color: #2e343a; color: #ffffff; text-align: center; padding: 1.5rem 1rem;">
                    <h3 style="margin: 0; font-size: 1.45rem; font-weight: 400; letter-spacing: 0.5px;">Cadastrar Novo Colaborador</h3>
                </div>
                
                <div style="padding: 2.5rem 2.5rem 2rem 2.5rem;">
                    <form action="{{ url_for('contatos.novo_contato') }}" method="POST">
                        
                        <div style="margin-bottom: 1.5rem;">
                            <label for="nome" style="display: inline-block; margin-bottom: 0.6rem; color: #444444; font-size: 1.05rem; font-weight: 500;">Nome Completo *</label>
                            <input type="text" id="nome" name="nome" required style="display: block; width: 100%; padding: 0.75rem 0.8rem; font-size: 1.05rem; color: #333333; background-color: #fff; border: 1px solid #cccccc; border-radius: 4px; box-sizing: border-box;">
                        </div>
                     
                        <div style="margin-bottom: 1.5rem;">
                            <label for="email" style="display: inline-block; margin-bottom: 0.6rem; color: #444444; font-size: 1.05rem; font-weight: 500;">E-mail Corporativo *</label>
                            <input type="email" id="email" name="email" required style="display: block; width: 100%; padding: 0.75rem 0.8rem; font-size: 1.05rem; color: #333333; background-color: #fff; border: 1px solid #cccccc; border-radius: 4px; box-sizing: border-box;">
                        </div>
                        
                       
                        <div style="margin-bottom: 2.2rem;">
                            <label for="telefone" style="display: inline-block; margin-bottom: 0.6rem; color: #444444; font-size: 1.05rem; font-weight: 500;">Telefone</label>
                            <input type="text" id="telefone" name="telefone" style="display: block; width: 100%; padding: 0.75rem 0.8rem; font-size: 1.05rem; color: #333333; background-color: #fff; border: 1px solid #cccccc; border-radius: 4px; box-sizing: border-box;">
                        </div>
                        
                        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                        
                            <a href="{{ url_for('contatos.listar_contatos') }}" style="display: inline-flex; align-items: center; justify-content: center; background-color: #6c757d; color: #ffffff; text-decoration: none; padding: 0.65rem 1.8rem; font-size: 1rem; font-weight: 500; border-radius: 4px; border: none; cursor: pointer;">
                                Voltar
                            </a>
                            
                            <button type="submit" style="display: inline-flex; align-items: center; justify-content: center; background-color: #007bff; color: #ffffff; padding: 0.65rem 1.8rem; font-size: 1rem; font-weight: 500; border-radius: 4px; border: none; cursor: pointer;">
                                Salvar Registro
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
