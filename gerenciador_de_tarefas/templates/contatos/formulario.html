{% extends 'base.html' %}

{% block content %}
<div class="container">
  <div style="display: flex; justify-content: center; margin-top: 4rem;">
    <div style="width: 100%; max-width: 600px;">
      <div class="card" style="background-color: #fff; border-radius: 4px; box-shadow: 0 12px 28px rgba(0,0,0,.35); border: none; overflow: hidden;">

        <div style="background-color: #2e343a; color: #fff; text-align: center; padding: 1.5rem 1rem;">
          <h3 style="margin: 0; font-size: 1.45rem; font-weight: 400;">{{ 'Editar Tarefa' if tarefa else 'Nova Tarefa' }}</h3>
        </div>

        <div style="padding: 2.5rem 2.5rem 2rem 2.5rem;">
          <form action="" method="POST">

            <div style="margin-bottom: 1.5rem;">
              <label for="descricao" style="display:inline-block; margin-bottom:.6rem; color:#444; font-weight:500;">Descrição *</label>
              <input type="text" id="descricao" name="descricao" required
                     value="{{ tarefa.descricao if tarefa else '' }}"
                     style="display:block; width:100%; padding:.75rem .8rem; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
            </div>

            <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
              <div style="flex: 1;">
                <label for="prazo" style="display:inline-block; margin-bottom:.6rem; color:#444; font-weight:500;">Prazo</label>
                <input type="date" id="prazo" name="prazo"
                       value="{{ tarefa.prazo if tarefa and tarefa.prazo else '' }}"
                       style="display:block; width:100%; padding:.75rem .8rem; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
              </div>
              <div style="flex: 1;">
                <label for="prioridade" style="display:inline-block; margin-bottom:.6rem; color:#444; font-weight:500;">Prioridade</label>
                <select id="prioridade" name="prioridade"
                        style="display:block; width:100%; padding:.75rem .8rem; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
                  {% for p in prioridades %}
                    <option value="{{ p }}"
                      {% if tarefa and tarefa.prioridade == p %}selected
                      {% elif not tarefa and p == 'media' %}selected{% endif %}>{{ p | capitalize }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div style="margin-bottom: 1.5rem;">
              <label for="status" style="display:inline-block; margin-bottom:.6rem; color:#444; font-weight:500;">Status</label>
              <select id="status" name="status"
                      style="display:block; width:100%; padding:.75rem .8rem; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
                {% for s in status_opcoes %}
                  <option value="{{ s }}"
                    {% if tarefa and tarefa.status == s %}selected
                    {% elif not tarefa and s == 'fazer' %}selected{% endif %}>{{ s | capitalize }}</option>
                {% endfor %}
              </select>
            </div>

            <div style="margin-bottom: 2.2rem;">
              <label style="display:inline-block; margin-bottom:.6rem; color:#444; font-weight:500;">Responsáveis</label>
              <div style="border:1px solid #ccc; border-radius:4px; padding:.6rem .8rem; max-height:150px; overflow-y:auto;">
                {% for c in contatos %}
                  <label style="display:block; margin-bottom:.3rem; color:#333;">
                    <input type="checkbox" name="contatos_ids" value="{{ c.id }}"
                      {% if tarefa and tarefa.contatos and c.id in (tarefa.contatos | map(attribute='id') | list) %}checked{% endif %}>
                    {{ c.nome }}
                  </label>
                {% else %}
                  <span style="color:#999;">Nenhum contato cadastrado.</span>
                {% endfor %}
              </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
              <a href="{{ url_for('tarefas.listar') }}"
                 style="background:#6c757d; color:#fff; text-decoration:none; padding:.65rem 1.8rem; border-radius:4px;">Voltar</a>
              <button type="submit"
                      style="background:#007bff; color:#fff; padding:.65rem 1.8rem; border-radius:4px; border:none; cursor:pointer;">{{ 'Salvar Alterações' if tarefa else 'Salvar Tarefa' }}</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
