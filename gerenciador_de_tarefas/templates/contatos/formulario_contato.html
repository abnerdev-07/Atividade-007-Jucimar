<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Editar contato' if contato else 'Novo contato' }}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .container {
            max-width: 520px;
            margin: 40px auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd2da;
            border-radius: 7px;
            font-size: 15px;
        }

        .acoes {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .botao {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        .salvar {
            background: #2563eb;
            color: white;
        }

        .voltar {
            background: #e5e7eb;
            color: #222;
        }

        .mensagem {
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 7px;
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>{{ 'Editar contato' if contato else 'Cadastrar contato' }}</h1>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                {% if categoria.startswith('contato_') %}
                    <div class="mensagem">{{ mensagem }}</div>
                {% endif %}
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="nome">Nome *</label>
            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ contato['nome'] if contato else '' }}"
                required
            >

            <label for="email">E-mail *</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ contato['email'] if contato else '' }}"
                required
            >

            <label for="telefone">Telefone</label>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                value="{{ contato['telefone'] if contato else '' }}"
            >

            <div class="acoes">
                <a href="{{ url_for('contatos.listar_contatos') }}"
                   class="botao voltar">Cancelar</a>
                <button type="submit" class="botao salvar">
                    Salvar contato
                </button>
            </div>
        </form>
    </main>
</body>
</html>
